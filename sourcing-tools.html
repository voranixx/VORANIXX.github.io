<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourcing Tools - VORANIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: rgba(0, 0, 0, 0.95);
            padding: 20px 0;
            box-shadow: 0 2px 20px rgba(224, 31, 122, 0.3);
            border-bottom: 1px solid rgba(224, 31, 122, 0.2);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-v {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 8px;
        }

        .back-btn {
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(224, 31, 122, 0.6);
        }

        .hero-section {
            padding: 60px 0 40px;
            text-align: center;
            background: #000000;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(224, 31, 122, 0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-section h1 {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.1;
            letter-spacing: 2px;
        }

        .hero-section .tagline {
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            margin-bottom: 30px;
            opacity: 0.9;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
            letter-spacing: 2px;
            color: #e01f7a;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .stat-box {
            background: rgba(224, 31, 122, 0.1);
            border: 1px solid rgba(224, 31, 122, 0.3);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            min-width: 200px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: #e01f7a;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            color: #ffffff;
            opacity: 0.9;
        }

        /* Filter Section */
        .filter-section {
            background: rgba(10, 10, 10, 0.95);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(224, 31, 122, 0.3);
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(224, 31, 122, 0.2);
        }

        .filter-section h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e01f7a;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-select {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(224, 31, 122, 0.3);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-select:focus {
            outline: none;
            border-color: #e01f7a;
            box-shadow: 0 0 0 3px rgba(224, 31, 122, 0.2);
        }

        .filter-select option {
            background: #0a0a0a;
            color: #ffffff;
        }

        .search-box {
            position: relative;
            margin-top: 10px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(224, 31, 122, 0.3);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #e01f7a;
            box-shadow: 0 0 0 3px rgba(224, 31, 122, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #e01f7a;
            font-size: 1.2rem;
        }

        /* Groups Grid */
        .groups-section {
            padding: 0 0 60px;
        }

        .groups-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .groups-header h2 {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .count-badge {
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .group-card {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(224, 31, 122, 0.2);
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(224, 31, 122, 0.3);
            border-color: #e01f7a;
        }

        .group-badges {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .group-badge {
            background: rgba(224, 31, 122, 0.1);
            color: #e01f7a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(224, 31, 122, 0.3);
        }

        .group-badge.language {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.3);
        }

        .group-badge.focus {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .group-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .group-link {
            display: block;
            color: #999999;
            font-size: 0.9rem;
            margin-bottom: 20px;
            word-break: break-all;
            text-decoration: none;
            transition: color 0.3s;
        }

        .group-link:hover {
            color: #e01f7a;
        }

        .group-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .open-btn {
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .open-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(224, 31, 122, 0.5);
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #e01f7a;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #999999;
            font-size: 1.2rem;
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #e01f7a;
            opacity: 0.5;
        }

        /* Copy Notification */
        .copy-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(74, 222, 128, 0.4);
            z-index: 10000;
            opacity: 0;
            animation: slideUpCopy 0.3s ease forwards, fadeOutCopy 0.3s ease 1.7s forwards;
        }

        @keyframes slideUpCopy {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes fadeOutCopy {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        footer {
            background: #000000;
            color: white;
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid rgba(224, 31, 122, 0.2);
        }

        footer p {
            opacity: 0.7;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .footer-link {
            color: #e01f7a;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }
            
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .logo {
                justify-content: center;
            }
            
            .logo-text {
                font-size: 1.5rem;
                letter-spacing: 5px;
            }
            
            .hero-section {
                padding: 40px 0 30px;
            }
            
            .hero-section h1 {
                font-size: 2rem;
            }
            
            .hero-section .tagline {
                font-size: 1rem;
            }
            
            .stats-container {
                gap: 15px;
            }
            
            .stat-box {
                min-width: 150px;
                padding: 15px 20px;
            }
            
            .stat-number {
                font-size: 2rem;
            }
            
            .filter-section {
                padding: 20px;
            }
            
            .filter-grid {
                grid-template-columns: 1fr;
            }
            
            .groups-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .groups-grid {
                grid-template-columns: 1fr;
            }
            
            .group-card {
                padding: 20px;
            }
            
            .group-title {
                font-size: 1.2rem;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .stat-box {
                min-width: 100%;
            }
            
            .group-actions {
                flex-direction: column;
                gap: 10px;
            }
            
            .open-btn, .copy-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadGroups();
            setupFilters();
        });

        // Load groups into the grid
        function loadGroups(filteredGroups = groupsData) {
            const groupsGrid = document.getElementById('groupsGrid');
            const groupCount = document.getElementById('groupCount');
            
            if (filteredGroups.length === 0) {
                groupsGrid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No groups found</h3>
                        <p>Try adjusting your filters or search term</p>
                    </div>
                `;
                groupCount.textContent = '0 Groups';
                return;
            }
            
            groupsGrid.innerHTML = '';
            
            filteredGroups.forEach((group, index) => {
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';
                
                // Determine category badge text
                let categoryText = '';
                if (group.category === 'facebook') categoryText = 'Facebook Group';
                if (group.category === 'callcenter') categoryText = 'Call Center';
                if (group.category === 'sales') categoryText = 'Sales';
                if (group.category === 'language') categoryText = 'Language Group';
                
                // Determine language badge text
                let languageText = group.language === 'all' ? 'All Languages' : 
                                  group.language.charAt(0).toUpperCase() + group.language.slice(1);
                
                // Determine focus badge text
                let focusText = '';
                if (group.focus === 'general') focusText = 'General Jobs';
                if (group.focus === 'callcenter') focusText = 'Call Center';
                if (group.focus === 'sales') focusText = 'Sales';
                if (group.focus === 'customer') focusText = 'Customer Service';
                
                groupCard.innerHTML = `
                    <div class="group-badges">
                        <div class="group-badge">${categoryText}</div>
                        <div class="group-badge language">${languageText}</div>
                        <div class="group-badge focus">${focusText}</div>
                    </div>
                    
                    <h3 class="group-title">${group.name}</h3>
                    
                    <a href="${group.link}" target="_blank" class="group-link">
                        ${group.link}
                    </a>
                    
                    <div class="group-actions">
                        <a href="${group.link}" target="_blank" class="open-btn">
                            <i class="fas fa-external-link-alt"></i>
                            Open Group
                        </a>
                        <button class="copy-btn" onclick="copyGroupLink('${group.link}', this)">
                            <i class="far fa-copy"></i>
                            Copy Link
                        </button>
                    </div>
                `;
                
                groupsGrid.appendChild(groupCard);
            });
            
            groupCount.textContent = `${filteredGroups.length} Groups`;
        }

        // Setup filter functionality
        function setupFilters() {
            const categoryFilter = document.getElementById('categoryFilter');
            const languageFilter = document.getElementById('languageFilter');
            const focusFilter = document.getElementById('focusFilter');
            const searchInput = document.getElementById('searchInput');
            
            function applyFilters() {
                const selectedCategory = categoryFilter.value;
                const selectedLanguage = languageFilter.value;
                const selectedFocus = focusFilter.value;
                const searchTerm = searchInput.value.toLowerCase();
                
                const filteredGroups = groupsData.filter(group => {
                    // Filter by category
                    if (selectedCategory !== 'all' && group.category !== selectedCategory) {
                        return false;
                    }
                    
                    // Filter by language
                    if (selectedLanguage !== 'all' && group.language !== selectedLanguage) {
                        return false;
                    }
                    
                    // Filter by focus
                    if (selectedFocus !== 'all' && group.focus !== selectedFocus) {
                        return false;
                    }
                    
                    // Filter by search term
                    if (searchTerm && !group.name.toLowerCase().includes(searchTerm)) {
                        return false;
                    }
                    
                    return true;
                });
                
                loadGroups(filteredGroups);
            }
            
            // Add event listeners
            categoryFilter.addEventListener('change', applyFilters);
            languageFilter.addEventListener('change', applyFilters);
            focusFilter.addEventListener('change', applyFilters);
            searchInput.addEventListener('input', applyFilters);
        }

        // Copy group link to clipboard
        function copyGroupLink(link, button) {
            navigator.clipboard.writeText(link).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = '<i class="fas fa-check"></i> Copied!';
                button.style.background = 'linear-gradient(135deg, #4ade80, #22c55e)';
                button.style.borderColor = 'rgba(74, 222, 128, 0.3)';
                
                showCopyNotification();
                
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.style.background = 'rgba(255, 255, 255, 0.05)';
                    button.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy link. Please try again.');
            });
        }

        // Show copy notification
        function showCopyNotification() {
            const existingNotification = document.querySelector('.copy-notification');
            if (existingNotification) {
                existingNotification.remove();
            }
            
            const notification = document.createElement('div');
            notification.className = 'copy-notification';
            notification.innerHTML = `
                <i class="fas fa-check-circle"></i>
                <span>Link copied to clipboard!</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 2000);
        }
    </script>
