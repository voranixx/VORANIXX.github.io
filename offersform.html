<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORANIX | Interview Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Matrix Background */
        .jp-matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #05050a;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            grid-auto-rows: 40px;
            font-size: 32px;
            color: rgba(0, 150, 255, 0.4);
            font-family: "Courier New", Courier, monospace;
            justify-content: center;
            align-content: center;
            z-index: 0;
            pointer-events: none;
        }

        .jp-matrix > span {
            text-align: center;
            text-shadow: 0 0 5px rgba(0, 150, 255, 0.5);
            user-select: none;
            transition:
                color 0.5s,
                text-shadow 0.5s;
            line-height: 1;
            opacity: 0.3;
        }

        .jp-matrix > span:nth-child(19n + 2) {
            animation: smooth-pulse 3.5s ease-in-out infinite 0.2s;
        }
        .jp-matrix > span:nth-child(29n + 1) {
            animation: smooth-pulse 4.1s ease-in-out infinite 0.7s;
        }
        .jp-matrix > span:nth-child(11n) {
            color: rgba(100, 200, 255, 0.7);
            animation: smooth-pulse 2.9s ease-in-out infinite 1.1s;
        }
        .jp-matrix > span:nth-child(37n + 10) {
            animation: smooth-pulse 5.3s ease-in-out infinite 1.5s;
        }
        .jp-matrix > span:nth-child(41n + 1) {
            animation: smooth-pulse 3.9s ease-in-out infinite 0.4s;
        }
        .jp-matrix > span:nth-child(17n + 9) {
            animation: smooth-pulse 2.8s ease-in-out infinite 0.9s;
        }
        .jp-matrix > span:nth-child(23n + 18) {
            animation: smooth-pulse 4.3s ease-in-out infinite 1.3s;
        }
        .jp-matrix > span:nth-child(31n + 4) {
            animation: smooth-pulse 5.6s ease-in-out infinite 0.1s;
        }
        .jp-matrix > span:nth-child(43n + 20) {
            animation: smooth-pulse 3.6s ease-in-out infinite 1.8s;
        }
        .jp-matrix > span:nth-child(13n + 6) {
            animation: smooth-pulse 3.2s ease-in-out infinite 1.2s;
        }
        .jp-matrix > span:nth-child(53n + 5) {
            animation: smooth-pulse 4.9s ease-in-out infinite 0.5s;
        }
        .jp-matrix > span:nth-child(47n + 15) {
            animation: smooth-pulse 5.9s ease-in-out infinite 1s;
        }

        @keyframes smooth-pulse {
            0%,
            100% {
                color: rgba(0, 150, 255, 0.4);
                text-shadow: 0 0 5px rgba(0, 150, 255, 0.5);
            }
            30% {
                color: rgba(100, 200, 255, 1);
                text-shadow:
                    0 0 10px rgba(100, 200, 255, 1),
                    0 0 15px rgba(100, 200, 255, 1);
            }
            50% {
                color: rgba(255, 105, 180, 1);
                text-shadow:
                    0 0 10px rgba(255, 105, 180, 1),
                    0 0 15px rgba(255, 105, 180, 1);
            }
            70% {
                color: #ffffff;
                text-shadow:
                    0 0 10px #fff,
                    0 0 15px #fff,
                    0 0 20px #fff;
            }
        }

        /* Matrix Overlay */
        .matrix-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(0, 0, 0, 0.95) 0%,
                rgba(224, 31, 122, 0.1) 50%,
                rgba(0, 0, 0, 0.95) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Main Container */
        .form-container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .form-header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(224, 31, 122, 0.3);
            box-shadow: 0 5px 25px rgba(224, 31, 122, 0.2);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-v {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 8px;
        }

        .back-btn {
            background: rgba(224, 31, 122, 0.1);
            border: 1px solid rgba(224, 31, 122, 0.3);
            color: #e01f7a;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(224, 31, 122, 0.2);
            transform: translateX(-5px);
        }

        /* Form Hero */
        .form-hero {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(224, 31, 122, 0.2);
        }

        .form-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        /* Form Content */
        .form-content {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(224, 31, 122, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        .required::after {
            content: " *";
            color: #ff1744;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        /* إصلاح مشكلة الـ Select - خلفية داكنة للنصوص */
        .form-group select {
            background-color: rgba(0, 0, 0, 0.7);
        }

        .form-group select option {
            background-color: #000000;
            color: #ffffff;
            padding: 10px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e01f7a;
            box-shadow: 0 0 0 3px rgba(224, 31, 122, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        /* حقل Team Leader غير قابل للتعديل */
        .form-group input[readonly] {
            background: rgba(224, 31, 122, 0.1);
            border-color: rgba(224, 31, 122, 0.3);
            cursor: not-allowed;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-hint {
            display: block;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* زر Submit الجديد */
        .submit-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .custom-button-group {
            position: relative;
        }

        .custom-button {
            position: relative;
            display: inline-block;
            padding: 1px;
            font-weight: 600;
            line-height: 1.5;
            color: white;
            background-color: #111827;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            transform-origin: center;
        }

        .custom-button:hover {
            transform: scale(1.05);
        }

        .custom-button:active {
            transform: scale(0.95);
        }

        .custom-button::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 0;
        }

        .custom-button:hover::before {
            opacity: 1;
        }

        .custom-button-content {
            position: relative;
            z-index: 10;
            display: block;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            background-color: rgba(0, 0, 0, 0.95);
        }

        .button-inner {
            position: relative;
            z: 10;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .button-text {
            transition: transform 0.5s;
        }

        .custom-button:hover .button-text {
            transform: translateX(4px);
        }

        .button-icon {
            width: 1.5rem;
            height: 1.5rem;
            transition: transform 0.5s;
        }

        .custom-button:hover .button-icon {
            transform: translateX(4px);
        }

        /* أنيميشن الإرسال */
        .success-animation {
            display: none;
            text-align: center;
            padding: 40px 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .🤚 {
            --skin-color: #E4C560;
            --tap-speed: 0.6s;
            --tap-stagger: 0.1s;
            position: relative;
            width: 80px;
            height: 60px;
            margin: 20px auto;
        }

        .🤚:before {
            content: '';
            display: block;
            width: 180%;
            height: 75%;
            position: absolute;
            top: 70%;
            right: 20%;
            background-color: black;
            border-radius: 40px 10px;
            filter: blur(10px);
            opacity: 0.3;
        }

        .🌴 {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--skin-color);
            border-radius: 10px 40px;
        }

        .👍 {
            position: absolute;
            width: 120%;
            height: 38px;
            background-color: var(--skin-color);
            bottom: -18%;
            right: 1%;
            transform-origin: calc(100% - 20px) 20px;
            transform: rotate(-20deg);
            border-radius: 30px 20px 20px 10px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            border-left: 2px solid rgba(0,0,0,0.1);
        }

        .👍:after {
            width: 20%;
            height: 60%;
            content: '';
            background-color: rgba(255,255,255,0.3);
            position: absolute;
            bottom: -8%;
            left: 5px;
            border-radius: 60% 10% 10% 30%;
            border-right: 2px solid rgba(0,0,0,0.05);
        }

        .👉 {
            position: absolute;
            width: 80%;
            height: 35px;
            background-color: var(--skin-color);
            bottom: 32%;
            right: 64%;
            transform-origin: 100% 20px;
            animation-duration: calc(var(--tap-speed) * 2);
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            transform: rotate(10deg);
        }

        .👉:before {
            content: '';
            position: absolute;
            width: 140%;
            height: 30px;
            background-color: var(--skin-color);
            bottom: 8%;
            right: 65%;
            transform-origin: calc(100% - 20px) 20px;
            transform: rotate(-60deg);
            border-radius: 20px;
        }

        .👉:nth-child(1) {
            animation-delay: 0;
            filter: brightness(70%);
            animation-name: tap-upper-1;
        }

        .👉:nth-child(2) {
            animation-delay: var(--tap-stagger);
            filter: brightness(80%);
            animation-name: tap-upper-2;
        }

        .👉:nth-child(3) {
            animation-delay: calc(var(--tap-stagger) * 2);
            filter: brightness(90%);
            animation-name: tap-upper-3;
        }

        .👉:nth-child(4) {
            animation-delay: calc(var(--tap-stagger) * 3);
            filter: brightness(100%);
            animation-name: tap-upper-4;
        }

        @keyframes tap-upper-1 {
            0%, 50%, 100% {
                transform: rotate(10deg) scale(0.4);
            }

            40% {
                transform: rotate(50deg) scale(0.4);
            }
        }

        @keyframes tap-upper-2 {
            0%, 50%, 100% {
                transform: rotate(10deg) scale(0.6);
            }

            40% {
                transform: rotate(50deg) scale(0.6);
            }
        }

        @keyframes tap-upper-3 {
            0%, 50%, 100% {
                transform: rotate(10deg) scale(0.8);
            }

            40% {
                transform: rotate(50deg) scale(0.8);
            }
        }

        @keyframes tap-upper-4 {
            0%, 50%, 100% {
                transform: rotate(10deg) scale(1);
            }

            40% {
                transform: rotate(50deg) scale(1);
            }
        }

        .sent-text {
            font-size: 2.5rem;
            font-weight: 900;
            margin-top: 30px;
            background: linear-gradient(135deg, #e01f7a 0%, #ff1744 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeIn 0.5s forwards 3s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Footer */
        .form-footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border-top: 1px solid rgba(224, 31, 122, 0.2);
        }

        .form-footer p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-container {
                padding: 10px;
            }
            
            .form-content {
                padding: 25px 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .form-title {
                font-size: 2rem;
            }
            
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .logo-text {
                font-size: 1.5rem;
                letter-spacing: 5px;
            }
            
            .jp-matrix {
                grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
                grid-auto-rows: 30px;
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .form-title {
                font-size: 1.8rem;
            }
            
            .form-content {
                padding: 20px 15px;
            }
            
            .jp-matrix {
                grid-template-columns: repeat(auto-fill, minmax(25px, 1fr));
                grid-auto-rows: 25px;
                font-size: 20px;
            }
            
            .custom-button-content {
                padding: 0.5rem 1rem;
            }
            
            .button-text {
                font-size: 0.9rem;
            }
            
            .button-icon {
                width: 1.25rem;
                height: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix Background -->
    <div class="jp-matrix" id="matrixBackground"></div>
    
    <!-- Overlay for better readability -->
    <div class="matrix-overlay"></div>
    
    <!-- Main Container -->
    <div class="form-container">
        <!-- Header -->
        <header class="form-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-v">V</span>
                    <span class="logo-text">ORANIX</span>
                </div>
                <button class="back-btn" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i> Back to Main
                </button>
            </div>
        </header>

        <!-- Form Hero -->
        <div class="form-hero">
            <h1 class="form-title">Interview Registration</h1>
            <p class="form-subtitle">Complete the form below to register for your interview</p>
        </div>

        <!-- Form Content -->
        <div class="form-content">
            <form id="interviewForm">
                
                <!-- Date of Interview -->
                <div class="form-group">
                    <label for="interviewDate" class="required">Date of interview</label>
                    <input type="date" id="interviewDate" name="interviewDate" required>
                    <span class="form-hint">Month, day, year</span>
                </div>

                <!-- Candidate Name -->
                <div class="form-group">
                    <label for="candidateName" class="required">Candidate Name</label>
                    <input type="text" id="candidateName" name="candidateName" required 
                           placeholder="Enter candidate full name">
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phoneNumber" class="required">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" required 
                           placeholder="+20 XXX XXX XXXX">
                </div>

                <!-- National ID -->
                <div class="form-group">
                    <label for="nationalId">National Id</label>
                    <input type="text" id="nationalId" name="nationalId" 
                           placeholder="14-digit National ID">
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="emailAddress">Email Address</label>
                    <input type="email" id="emailAddress" name="emailAddress" 
                           placeholder="your.email@example.com">
                </div>

                <!-- Language -->
                <div class="form-group">
                    <label for="language" class="required">Language</label>
                    <select id="language" name="language" required>
                        <option value="">Select language</option>
                        <option value="english">English</option>
                        <option value="french">French</option>
                        <option value="spanish">Spanish</option>
                        <option value="italian">Italian</option>
                        <option value="german">German</option>
                        <option value="turkish">Turkish</option>
                        <option value="portuguese">Portuguese</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Graduation Status -->
                <div class="form-group">
                    <label for="graduationStatus" class="required">Graduation Status</label>
                    <select id="graduationStatus" name="graduationStatus" required>
                        <option value="">Select status</option>
                        <option value="grad">Grad</option>
                        <option value="undergrad">Undergrad</option>
                        <option value="gap-year">Gap Year</option>
                        <option value="drop-out">Drop Out</option>
                    </select>
                </div>

                <!-- Company Name -->
                <div class="form-group">
                    <label for="companyName" class="required">Company Name</label>
                    <select id="companyName" name="companyName" required onchange="showVoiceNoteField(this)">
                        <option value="">Select company</option>
                        <option value="Leadbull">Leadbull</option>
                        <option value="Dyninno">Dyninno</option>
                        <option value="Realogy">Realogy</option>
                        <option value="Insource">Insource</option>
                        <option value="OUTSOURCING SKILL">OUTSOURCING SKILL</option>
                        <option value="NAOS">N A O S</option>
                        <option value="Telephonic">Telephonic</option>
                        <option value="Vitrin Clinic">Vitrin Clinic</option>
                        <option value="LTS">LTS</option>
                        <option value="Phoenix">Phoenix</option>
                        <option value="IntouchCX">IntouchCX</option>
                        <option value="TTC">TTC</option>
                        <option value="HANG-UP Solutions">HANG-UP Solutions</option>
                        <option value="CXPERTS">CXPERTS</option>
                        <option value="Ultatek">Ultatek</option>
                        <option value="CNS">CNS</option>
                        <option value="FOODHUB">FOODHUB</option>
                        <option value="Creative Basket">Creative Basket</option>
                        <option value="VolumeX">VolumeX</option>
                        <option value="Buzz">Buzz</option>
                        <option value="Teleperformance">Teleperformance</option>
                        <option value="BPO HIVE (WFH)">BPO HIVE (WFH)</option>
                        <option value="WGS (B2B Campaign)">WGS (B2B Campaign)</option>
                        <option value="WGS (Solar Campaign)">WGS (Solar Campaign)</option>
                        <option value="Callix">Callix</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Other Company Input -->
                <div class="form-group" id="otherCompanyGroup" style="display: none;">
                    <label for="otherCompany">Other Company Name</label>
                    <input type="text" id="otherCompany" name="otherCompany" 
                           placeholder="Please specify company name">
                </div>

                <!-- Voice Note Link for BPO HIVE -->
                <div class="form-group" id="voiceNoteGroup" style="display: none;">
                    <label for="voiceNoteLink">If BPO HIVE (WFH) put the Voicenote link here</label>
                    <input type="url" id="voiceNoteLink" name="voiceNoteLink" 
                           placeholder="https://voca.ro/19251414520">
                    <span class="form-hint">Example: https://voca.ro/19251414520</span>
                </div>

                <!-- Experience -->
                <div class="form-group">
                    <label for="experience">Experience</label>
                    <select id="experience" name="experience">
                        <option value="">Select experience</option>
                        <option value="no-experience">No Experience</option>
                        <option value="3-months-sales">3+ Months sales</option>
                        <option value="3-months-customer-service">3+ Months customer service</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Recruiter Name -->
                <div class="form-group">
                    <label for="recruiterName" class="required">Recruiter Name</label>
                    <input type="text" id="recruiterName" name="recruiterName" required 
                           placeholder="Enter recruiter name">
                </div>

                <!-- Team Leader Name -->
                <div class="form-group">
                    <label for="teamLeaderName" class="required">Team Leader Name</label>
                    <input type="text" id="teamLeaderName" name="teamLeaderName" required 
                           value="Seif Yasser" readonly>
                </div>

                <!-- Submit Button -->
                <div class="submit-container">
                    <div class="custom-button-group">
                        <button type="submit" class="custom-button">
                            <span class="custom-button-content">
                                <span class="button-inner">
                                    <span class="button-text">Submit Registration</span>
                                    <svg class="button-icon" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                        <path clip-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" fill-rule="evenodd"></path>
                                    </svg>
                                </span>
                            </span>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Success Animation -->
            <div class="success-animation" id="successAnimation">
                <div class="🤚">
                    <div class="👉"></div>
                    <div class="👉"></div>
                    <div class="👉"></div>
                    <div class="👉"></div>
                    <div class="🌴"></div>		
                    <div class="👍"></div>
                </div>
                <div class="sent-text" id="sentText"></div>
            </div>
        </div>
    </div>

    <script>
        // Initialize matrix background
        document.addEventListener('DOMContentLoaded', function() {
            initMatrixBackground();
            setupFormValidation();
        });

        // Matrix Background
        function initMatrixBackground() {
            const matrix = document.getElementById('matrixBackground');
            const characters = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ';
            
            // Create matrix characters
            for (let i = 0; i < 300; i++) {
                const span = document.createElement('span');
                span.textContent = characters[Math.floor(Math.random() * characters.length)];
                matrix.appendChild(span);
            }
        }

        // Show/hide other company field
        function showVoiceNoteField(select) {
            const companyValue = select.value;
            const voiceNoteGroup = document.getElementById('voiceNoteGroup');
            const otherCompanyGroup = document.getElementById('otherCompanyGroup');
            
            // Show voice note field for BPO HIVE
            if (companyValue === 'BPO HIVE (WFH)') {
                voiceNoteGroup.style.display = 'block';
            } else {
                voiceNoteGroup.style.display = 'none';
            }
            
            // Show other company field
            if (companyValue === 'other') {
                otherCompanyGroup.style.display = 'block';
            } else {
                otherCompanyGroup.style.display = 'none';
            }
        }

        // Form validation
        function setupFormValidation() {
            const form = document.getElementById('interviewForm');
            
            // Add required field validation
            form.addEventListener('submit', handleSubmit);
            
            // Add visual feedback for required fields
            const requiredFields = form.querySelectorAll('[required]');
            requiredFields.forEach(field => {
                field.addEventListener('blur', function() {
                    if (!this.value.trim()) {
                        this.style.borderColor = '#ff1744';
                    } else {
                        this.style.borderColor = '';
                    }
                });
            });
        }

        // Handle form submission
        async function handleSubmit(event) {
            event.preventDefault();
            
            // Validate required fields
            const form = event.target;
            const requiredFields = form.querySelectorAll('[required]');
            let isValid = true;
            
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.style.borderColor = '#ff1744';
                    isValid = false;
                }
            });
            
            if (!isValid) {
                alert('Please fill all required fields (marked with *)');
                return;
            }
            
            // Show loading state
            const submitBtn = form.querySelector('.custom-button');
            const originalContent = submitBtn.innerHTML;
            submitBtn.innerHTML = `
                <span class="custom-button-content">
                    <span class="button-inner">
                        <span class="button-text">Submitting...</span>
                        <i class="fas fa-spinner fa-spin button-icon"></i>
                    </span>
                </span>
            `;
            submitBtn.style.cursor = 'wait';
            submitBtn.disabled = true;
            
            // Prepare form data
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                // Send data to Formspree
                const response = await fetch('https://formspree.io/f/mlgjwozl', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    // Show success animation
                    form.style.display = 'none';
                    const successAnimation = document.getElementById('successAnimation');
                    const sentText = document.getElementById('sentText');
                    
                    successAnimation.style.display = 'flex';
                    
                    // After 3 seconds, show "Sent"
                    setTimeout(() => {
                        sentText.textContent = 'Sent Successfully!';
                    }, 3000);
                    
                    // Reset form after 5 seconds
                    setTimeout(() => {
                        form.reset();
                        form.style.display = 'block';
                        successAnimation.style.display = 'none';
                        sentText.textContent = '';
                        submitBtn.innerHTML = originalContent;
                        submitBtn.style.cursor = 'pointer';
                        submitBtn.disabled = false;
                    }, 5000);
                    
                } else {
                    throw new Error('Form submission failed');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('There was an error submitting the form. Please try again.');
                submitBtn.innerHTML = originalContent;
                submitBtn.style.cursor = 'pointer';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
